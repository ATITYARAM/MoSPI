<!DOCTYPE html>
<html lang="en">

<head>
	<meta name="generator" content="Hugo 0.164.0"><script src="/livereload.js?mindelay=10&amp;v=2&amp;port=1313&amp;path=livereload" data-no-instant defer></script>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MoSPI</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="container">

    <h1>MoSPI</h1>

    <hr>

    <h2>Live MoSPI</h2>

    <button id="load">
        Load Datasets
    </button>

    <p id="datasetStatus"></p>

    <div id="datasets"></div>

    <hr>

    <h2>Upload CSV</h2>

    <input
        type="file"
        id="csvFile"
        accept=".csv">

    <br><br>

    <p>
        <strong>Selected File :</strong>
        <span id="fileName">None</span>
    </p>

    <p>
        <strong>Status :</strong>
        <span id="fileStatus">Waiting...</span>
    </p>

    <p>
        <strong>Rows :</strong>
        <span id="rowCount">0</span>
    </p>

    <p>
        <strong>Columns :</strong>
        <span id="columnCount">0</span>
    </p>

    <hr>

    <h2>Columns</h2>

    <div id="columns"></div>

    <br>

    <p>
        <strong>Selected Column :</strong>
        <span id="selectedColumn">None</span>
    </p>

    <hr>

    <h2>JSON</h2>

    <pre id="json"></pre>

</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script src="/js/app.js"></script>

<script src="/js/upload.js"></script>

</body>

</html>
